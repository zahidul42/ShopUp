<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ShopUp</title>
<style>
:root{--bg:#f4f6f8;--card:rgba(255,255,255,.93);--veil:rgba(244,246,248,.42);--veilApp:rgba(244,246,248,.84);--ink:#1d2733;--mute:#6a7686;--line:#dde3ea;--blue:#2c5b8a;--blueSoft:#e4edf6;--green:#2e7d4a;--greenSoft:#e3f2e8;--red:#b3362f;--redSoft:#fbe6e4;--amber:#a86a00;--amberSoft:#fcf0d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--card:rgba(24,33,43,.93);--veil:rgba(10,15,20,.55);--veilApp:rgba(10,15,20,.86);--ink:#e6ebf1;--mute:#93a0af;--line:#2a3643;--blue:#6fa3d6;--blueSoft:#1f3144;--green:#5fbf84;--greenSoft:#1a3326;--red:#e9807a;--redSoft:#3b1f1e;--amber:#e3b04b;--amberSoft:#3a2e12}}
:root[data-theme="dark"]{--bg:#10161d;--card:rgba(24,33,43,.93);--veil:rgba(10,15,20,.55);--veilApp:rgba(10,15,20,.86);--ink:#e6ebf1;--mute:#93a0af;--line:#2a3643;--blue:#6fa3d6;--blueSoft:#1f3144;--green:#5fbf84;--greenSoft:#1a3326;--red:#e9807a;--redSoft:#3b1f1e;--amber:#e3b04b;--amberSoft:#3a2e12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
header{background:var(--blue);color:#fff;display:flex;align-items:center;gap:12px;padding:12px 18px;flex-wrap:wrap}
header b{font-size:18px;letter-spacing:.2px}
header .sp{flex:1}
.pill{background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px;font-size:13px}
.ghost{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:6px;padding:5px 12px;cursor:pointer}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 14px 0;border-bottom:1px solid var(--line);background:var(--card)}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--mute);white-space:nowrap}
nav button.on{color:var(--blue);border-color:var(--blue);font-weight:600}
main{max-width:980px;margin:0 auto;padding:20px 16px 60px}
h2{margin:0 0 4px;font-size:21px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat small{color:var(--mute);display:block}
.stat strong{font-size:22px}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:var(--blueSoft);text-align:left;font-size:13px;padding:9px 10px;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.low td{background:var(--redSoft)}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
td input{width:76px;padding:6px 8px}
.row{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:var(--green);color:#fff;border:0;border-radius:6px;padding:9px 18px;cursor:pointer;font-weight:600}
.btn.alt{background:var(--blueSoft);color:var(--blue)}
.btn.sm{padding:5px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--blueSoft);color:var(--blue)}
.tag.g{background:var(--greenSoft);color:var(--green)}.tag.r{background:var(--redSoft);color:var(--red)}.tag.a{background:var(--amberSoft);color:var(--amber)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--green)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.steps span{padding:4px 10px;border-radius:99px;font-size:12px;background:var(--line);color:var(--mute)}
.steps span.done{background:var(--greenSoft);color:var(--green)}
.steps span.now{background:var(--green);color:#fff}
.pay{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;cursor:pointer;color:var(--ink);font-size:15px;margin-top:0}
.pay input{width:auto}
.pay.sel{border-color:var(--green);background:var(--greenSoft)}
.empty{color:var(--mute);padding:18px 4px}
#auth{max-width:440px;margin:40px auto;padding:0 16px}
.tabs{display:flex;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:9}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}

html{background:var(--bg)}

<body>

<section id="auth">
  <h2 style="color:var(--blue);font-size:26px;margin-bottom:2px">ShopUp</h2>
  <p class="sub">Order stock for your shop, pay now or later, and see where your delivery is.</p>
  <div class="tabs"><button id="tReg" class="on" onclick="authTab('reg')">Create account</button><button id="tLog" onclick="authTab('log')">Log in</button></div>
  <div class="card">
    <form id="reg" onsubmit="return doAuth(event,'reg')">
      <label for="shop" style="margin-top:0">Shop name</label><input id="shop" required>
      <label for="owner">Owner name</label><input id="owner" required>
      <label for="phone">Phone number</label><input id="phone" inputmode="tel" required>
      <label for="addr">Business address</label><input id="addr" required>
      <label for="nid">Trade license or NID</label><input id="nid" required>
      <div class="row"><div><label for="pw">Password</label><input id="pw" type="password" minlength="6" required></div><div><label for="pw2">Confirm password</label><input id="pw2" type="password" required></div></div>
      <p style="margin:16px 0 0"><button class="btn" type="submit">Register</button></p>
    </form>
    <form id="log" class="hidden" onsubmit="return doAuth(event,'log')">
      <label for="lid" style="margin-top:0">Phone or email</label><input id="lid" required>
      <label for="lpw">Password</label><input id="lpw" type="password" required>
      <label for="role">Log in as</label>
      <select id="role"><option value="retailer">Retail shop owner</option><option value="warehouse">Warehouse manager</option><option value="admin">System administrator</option></select>
      <p style="margin:16px 0 0"><button class="btn" type="submit">Log in</button></p>
    </form>
  </div>
  <p class="sub" style="font-size:13px">This is a front end demo. Nothing is sent anywhere, so any details will work.</p>
</section>

<div id="app" class="hidden">
  <header><b>ShopUp</b><span class="pill" id="who"></span><span class="sp"></span><button class="ghost" onclick="logout()">Log out</button></header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>
<div id="toast" role="status"></div>

<script>
const tk=n=>'Tk '+Math.round(n).toLocaleString('en-US');
const S={
 role:null,page:null,
 me:{shop:'Rahman General Store',owner:'Abdur Rahman',phone:'01711 000000',addr:'12 Station Road, Gazipur',status:'Verified'},
 products:[
  {id:1,name:'Rice (50kg)',cat:'Grocery',stock:1200,min:300,inn:200,out:80,price:2450,disc:5,from:10,sup:'Bengal Agro'},
  {id:2,name:'Soybean Oil (5L)',cat:'Grocery',stock:860,min:250,inn:0,out:140,price:780,disc:3,from:20,sup:'Meghna Foods'},
  {id:3,name:'Sugar (25kg)',cat:'Grocery',stock:180,min:300,inn:0,out:60,price:1150,disc:4,from:10,sup:'Padma Traders'},
  {id:4,name:'Lentils (25kg)',cat:'Grocery',stock:420,min:150,inn:50,out:30,price:2100,disc:3,from:10,sup:'Bengal Agro'},
  {id:5,name:'Laundry Soap (carton)',cat:'Household',stock:95,min:100,inn:0,out:12,price:960,disc:2,from:5,sup:'Jamuna Home'}
 ],
 cart:{},
 credit:{limit:50000,used:18400,repay:[{d:'12 Sep 2026',a:5000},{d:'30 Aug 2026',a:3200}]},
 orders:[{id:1041,total:21600,pay:'Digital Payment',date:'03 Oct 2026',del:'Delivered'},{id:1042,total:9800,pay:'Pay Later',date:'06 Oct 2026',del:'Out for Delivery'}],
 pm:'Pay Later'
};
const STEPS=['Ready','Assigned','Out for Delivery','Delivered'];
const NAV={
 retailer:[['shop','Products'],['cart','Cart and payment'],['wallet','Credit wallet'],['track','My orders'],['profile','Profile']],
 warehouse:[['stock','Inventory'],['deliv','Deliveries']],
 admin:[['over','Overview'],['orders','All orders'],['stock','Stock levels']]
};
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),2600)}
function authTab(w){$('reg').classList.toggle('hidden',w!=='reg');$('log').classList.toggle('hidden',w!=='log');$('tReg').classList.toggle('on',w==='reg');$('tLog').classList.toggle('on',w==='log')}
function doAuth(e,k){e.preventDefault();
 if(k==='reg'){if($('pw').value!==$('pw2').value){toast('Passwords do not match. Type them again.');return false}
  Object.assign(S.me,{shop:$('shop').value,owner:$('owner').value,phone:$('phone').value,addr:$('addr').value});S.me.status='Pending check';enter('retailer')}
 else enter($('role').value);
 return false}
function enter(r){S.role=r;S.page=NAV[r][0][0];document.body.classList.add('inapp');$('auth').classList.add('hidden');$('app').classList.remove('hidden');
 $('who').textContent=r==='retailer'?S.me.shop:r==='warehouse'?'Warehouse manager':'Administrator';render()}
function logout(){S.role=null;document.body.classList.remove('inapp');$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
function go(p){S.page=p;render()}
function render(){
 $('nav').innerHTML=NAV[S.role].map(([k,l])=>`<button class="${S.page===k?'on':''}" onclick="go('${k}')">${l}${k==='cart'&&cartCount()?` (${cartCount()})`:''}</button>`).join('');
 $('view').innerHTML=V[S.role+':'+S.page]?V[S.role+':'+S.page]():V[S.page]();
 window.scrollTo(0,0)}
const cartCount=()=>Object.values(S.cart).reduce((a,b)=>a+b,0);
const avail=()=>S.credit.limit-S.credit.used;
const line=(p,q)=>{const g=p.price*q,d=q>=p.from?g*p.disc/100:0;return{g,d,n:g-d}};
function totals(){let g=0,d=0;for(const id in S.cart){const p=S.products.find(x=>x.id==id),l=line(p,S.cart[id]);g+=l.g;d+=l.d}return{g,d,n:g-d}}
function deliveryOf(o){return o.del}
function stepsHtml(cur){const i=STEPS.indexOf(cur);return '<div class="steps">'+STEPS.map((s,j)=>`<span class="${j<i||cur==='Delivered'&&j<=i?'done':j===i?'now':''}">${s}</span>`).join('')+'</div>'}

const V={
shop(){return `<h2>Wholesale products</h2><p class="sub">Buy more of one item and the bulk discount kicks in automatically.</p>
<div class="card"><input id="q" placeholder="Search products" oninput="filt()" aria-label="Search products">
<div class="wrap" style="margin-top:12px"><table><thead><tr><th>Product</th><th>Category</th><th>In stock</th><th>Price</th><th>Bulk discount</th><th>Supplier</th><th>Quantity</th><th></th></tr></thead><tbody id="pl">${plRows('')}</tbody></table></div></div>`},
cart(){const ids=Object.keys(S.cart);if(!ids.length)return `<h2>Your cart</h2><div class="card empty">Nothing here yet. Pick a few things from <a href="#" onclick="go('shop');return false">Products</a>.</div>`;
 const t=totals();
 return `<h2>Cart and payment</h2><p class="sub">Check your items, choose how to pay, and confirm.</p>
<div class="card wrap"><table><thead><tr><th>Item</th><th>Qty</th><th>Amount</th><th>Discount</th><th></th></tr></thead><tbody>${ids.map(id=>{const p=S.products.find(x=>x.id==id),l=line(p,S.cart[id]);return `<tr><td>${p.name}</td><td>${S.cart[id]}</td><td>${tk(l.g)}</td><td>${l.d?'-'+tk(l.d):'None'}</td><td><button class="btn alt sm" onclick="rm(${id})">Remove</button></td></tr>`}).join('')}</tbody></table></div>
<div class="grid"><div class="card"><div class="row"><div><label style="margin-top:0">Order total</label><input readonly value="${tk(t.n)}"></div><div><label style="margin-top:0">Discount applied</label><input readonly value="${tk(t.d)}"></div></div>
<label>Payment method</label>${['Cash on Delivery','Digital Payment','Pay Later'].map(m=>`<label class="pay ${S.pm===m?'sel':''}"><input type="radio" name="pm" ${S.pm===m?'checked':''} onchange="S.pm='${m}';render()">${m==='Pay Later'?'Pay Later (credit wallet)':m}</label>`).join('')}
${S.pm==='Pay Later'?`<p class="sub" style="margin:0 0 10px">Available credit: <b>${tk(avail())}</b>${t.n>avail()?' <span class="tag r">Not enough</span>':''}</p>`:''}
<button class="btn" onclick="checkout()">Confirm payment</button></div></div>`},
wallet(){const c=S.credit,pct=c.used/c.limit*100;
 return `<h2>Credit wallet</h2><p class="sub">Your Pay Later balance. It updates after every credit order and repayment.</p>
<div class="grid"><div class="stat"><small>Credit limit</small><strong>${tk(c.limit)}</strong></div><div class="stat"><small>Used</small><strong>${tk(c.used)}</strong></div><div class="stat"><small>Available</small><strong style="color:var(--green)">${tk(avail())}</strong></div></div>
<div class="bar" aria-label="Credit used"><i style="width:${pct}%"></i></div>
<div class="card"><h3 style="margin-top:0">Repay</h3><div class="row"><div><label for="ra" style="margin-top:0">Amount (Tk)</label><input id="ra" type="number" min="1" placeholder="5000"></div><div style="align-self:end"><button class="btn" onclick="repay()">Repay now</button></div></div></div>
<div class="card wrap"><h3 style="margin-top:0">Repayment history</h3><table><thead><tr><th>Date</th><th>Amount paid</th><th>Status</th></tr></thead><tbody>${c.repay.map(r=>`<tr><td>${r.d}</td><td>${tk(r.a)}</td><td><span class="tag g">Cleared</span></td></tr>`).join('')}</tbody></table></div>`},
track(){return `<h2>My orders</h2><p class="sub">Delivery moves from Ready to Assigned, then Out for Delivery, then Delivered.</p>`+[...S.orders].reverse().map(o=>`<div class="card"><b>Order #${o.id}</b> <span class="tag ${o.del==='Delivered'?'g':'a'}">${o.del}</span><div class="sub" style="margin:2px 0 0">${o.date} · ${tk(o.total)} · ${o.pay}</div>${stepsHtml(o.del)}</div>`).join('')},
profile(){const m=S.me;return `<h2>Retailer profile</h2><p class="sub">Keep your details current so orders and credit checks go smoothly.</p>
<div class="card"><label style="margin-top:0">Shop name</label><input id="p1" value="${m.shop}"><label>Owner name</label><input id="p2" value="${m.owner}"><label>Phone</label><input id="p3" value="${m.phone}"><label>Address</label><input id="p4" value="${m.addr}">
<div class="row"><div><label>Business verification</label><input readonly value="${m.status}"></div><div><label>Credit limit</label><input readonly value="${tk(S.credit.limit)}"></div></div>
<label>Outstanding balance</label><input readonly value="${tk(S.credit.used)}"><p><button class="btn" onclick="saveProfile()">Save changes</button></p></div>`},
'warehouse:stock'(){return stockView(true)},
'admin:stock'(){return stockView(false)},
'warehouse:deliv'(){const list=S.orders;return `<h2>Deliveries</h2><p class="sub">Move each order along as it leaves the warehouse.</p><div class="card wrap"><table><thead><tr><th>Order</th><th>Retailer</th><th>Address</th><th>Status</th><th></th></tr></thead><tbody>${list.map(o=>{const i=STEPS.indexOf(o.del);return `<tr><td>#${o.id}</td><td>${S.me.shop}</td><td>${S.me.addr}</td><td><span class="tag ${i===3?'g':'a'}">${o.del}</span></td><td>${i<3?`<button class="btn sm" onclick="adv(${o.id})">Mark ${STEPS[i+1]}</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`},
'admin:over'(){const rev=S.orders.reduce((a,o)=>a+o.total,0),low=S.products.filter(p=>p.stock<p.min).length;
 return `<h2>Platform overview</h2><p class="sub">A quick look at how things are going today.</p><div class="grid"><div class="stat"><small>Orders</small><strong>${S.orders.length}</strong></div><div class="stat"><small>Order value</small><strong>${tk(rev)}</strong></div><div class="stat"><small>Credit out with retailers</small><strong>${tk(S.credit.used)}</strong></div><div class="stat"><small>Items below minimum</small><strong style="color:${low?'var(--red)':'var(--green)'}">${low}</strong></div></div>
<div class="card" style="margin-top:16px"><h3 style="margin-top:0">Needs attention</h3>${S.products.filter(p=>p.stock<p.min).map(p=>`<p style="margin:6px 0">${p.name} has ${p.stock} left, minimum is ${p.min}.</p>`).join('')||'<p class="empty">All stock is above the minimum.</p>'}</div>`},
'admin:orders'(){return `<h2>All orders</h2><p class="sub">Orders over Tk 40,000 are flagged for a fraud check.</p><div class="card wrap"><table><thead><tr><th>Order</th><th>Date</th><th>Payment</th><th>Total</th><th>Check</th></tr></thead><tbody>${S.orders.map(o=>`<tr><td>#${o.id}</td><td>${o.date}</td><td>${o.pay}</td><td>${tk(o.total)}</td><td>${o.total>40000?'<span class="tag r">Review</span>':'<span class="tag g">Clear</span>'}</td></tr>`).join('')}</tbody></table></div>`}
};
function plRows(q){return S.products.filter(p=>p.name.toLowerCase().includes(q.toLowerCase())).map(p=>`<tr><td>${p.name}</td><td>${p.cat}</td><td>${p.stock.toLocaleString('en-US')}</td><td>${tk(p.price)}</td><td>${p.disc}% (${p.from}+)</td><td>${p.sup}</td><td><input type="number" min="1" id="q${p.id}" placeholder="0" aria-label="Quantity of ${p.name}"></td><td><button class="btn sm" onclick="add(${p.id})">Add to cart</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No product matches that search.</td></tr>'}
function filt(){$('pl').innerHTML=plRows($('q').value)}
function add(id){const p=S.products.find(x=>x.id===id),q=parseInt($('q'+id).value);
 if(!q||q<1)return toast('Enter a quantity first.');
 if((S.cart[id]||0)+q>p.stock)return toast('Only '+p.stock+' of '+p.name+' in stock.');
 S.cart[id]=(S.cart[id]||0)+q;toast(q+' x '+p.name+' added');render()}
function rm(id){delete S.cart[id];render()}
function checkout(){const t=totals();
 if(S.pm==='Pay Later'&&t.n>avail())return toast('Your available credit is '+tk(avail())+'. Pick another method or repay first.');
 for(const id in S.cart){const p=S.products.find(x=>x.id==id);p.stock-=S.cart[id];p.out+=S.cart[id]}
 if(S.pm==='Pay Later')S.credit.used+=t.n;
 const id=1000+S.orders.length+41-1;
 S.orders.push({id:id+1,total:t.n,pay:S.pm,date:'07 Oct 2026',del:'Ready'});S.cart={};toast('Order #'+(id+1)+' confirmed');S.page='track';render()}
function repay(){const a=parseInt($('ra').value);
 if(!a||a<1)return toast('Enter an amount to repay.');
 if(a>S.credit.used)return toast('You only owe '+tk(S.credit.used)+'.');
 S.credit.used-=a;S.credit.repay.unshift({d:'07 Oct 2026',a});toast(tk(a)+' repaid');render()}
function saveProfile(){S.me.shop=$('p1').value;S.me.owner=$('p2').value;S.me.phone=$('p3').value;S.me.addr=$('p4').value;$('who').textContent=S.me.shop;toast('Profile saved')}
function stockView(edit){return `<h2>${edit?'Warehouse and inventory':'Stock levels'}</h2><p class="sub">Red rows are below the minimum and need a restock.</p><div class="card wrap"><table><thead><tr><th>Product</th><th>Current stock</th><th>Min. stock</th><th>In / Out today</th><th>Updated</th>${edit?'<th></th>':''}</tr></thead><tbody>${S.products.map(p=>`<tr class="${p.stock<p.min?'low':''}"><td>${p.name}</td><td>${edit?`<input type="number" id="s${p.id}" value="${p.stock}" aria-label="Stock for ${p.name}">`:p.stock.toLocaleString('en-US')}</td><td>${p.min}</td><td>+${p.inn} / -${p.out}</td><td>Today</td>${edit?`<td><button class="btn sm" onclick="setStock(${p.id})">Update stock</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function setStock(id){const p=S.products.find(x=>x.id===id),v=parseInt($('s'+id).value);
 if(isNaN(v)||v<0)return toast('Stock must be zero or more.');
 if(v>p.stock)p.inn+=v-p.stock;p.stock=v;toast(p.name+' updated'+(v<p.min?'. Below minimum, restock needed.':''));render()}
function adv(id){const o=S.orders.find(x=>x.id===id);o.del=STEPS[STEPS.indexOf(o.del)+1];toast('Order #'+id+' is now '+o.del);render()}
</script>
</body>
</html>
